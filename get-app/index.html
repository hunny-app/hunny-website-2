<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Download Hunny: Parent-Child Bonding from the App Store. Stay close to the small moments, even during busy days."
    />
    <meta name="theme-color" content="#fff9ed" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Get Hunny: Parent-Child Bonding" />
    <meta
      property="og:description"
      content="Stay close to the small moments, even during busy days."
    />
    <meta
      property="og:image"
      content="https://www.hunnyappai.com/Assets/hunny-logo-color-header.png"
    />
    <meta property="og:url" content="https://www.hunnyappai.com/get-app/" />
    <link rel="canonical" href="https://www.hunnyappai.com/get-app/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,500..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../get-app.css" />
    <title>Get Hunny: Parent-Child Bonding</title>
  </head>
  <body>
    <main class="download-page">
      <section class="download-card" aria-labelledby="download-heading">
        <div class="download-card__glow" aria-hidden="true"></div>

        <div class="download-card__content">
          <div class="download-logo-wrap">
            <img
              class="download-logo"
              src="../Assets/hunny-logo-color-header.png"
              alt="Hunny"
              width="1254"
              height="1254"
            />
          </div>

          <p class="download-eyebrow">PARENT-CHILD BONDING</p>
          <h1 id="download-heading">Stay close to the small moments.</h1>
          <p class="download-description">
            Hunny helps you stay connected with your child, even during the busiest days.
          </p>
        </div>

        <div class="download-actions">
          <a
            class="download-button"
            href="https://apps.apple.com/ca/app/hunny-parent-child-bonding/id6784933624"
            aria-label="Get Hunny: Parent-Child Bonding on the App Store"
            data-app-store-link
          >
            <span class="download-button__kicker">Download on the</span>
            <span class="download-button__label">App Store</span>
          </a>
          <p class="download-note">
            If Instagram asks, choose <strong>Open in external browser</strong>.
          </p>
        </div>
      </section>
    </main>

    <script>
      (function () {
        var appStoreButton = document.querySelector("[data-app-store-link]");
        if (!appStoreButton) return;

        var appStoreAppUrl = "itms-apps://itunes.apple.com/app/id6784933624";
        var appStoreWebUrl = appStoreButton.href;

        appStoreButton.addEventListener("click", function (event) {
          event.preventDefault();

          var leftPage = false;
          var markPageLeft = function () {
            if (document.hidden) leftPage = true;
          };

          document.addEventListener("visibilitychange", markPageLeft);
          window.location.href = appStoreAppUrl;

          window.setTimeout(function () {
            document.removeEventListener("visibilitychange", markPageLeft);
            if (!leftPage) window.location.href = appStoreWebUrl;
          }, 1200);
        });
      })();
    </script>
  </body>
</html>
