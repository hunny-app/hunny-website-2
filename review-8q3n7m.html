<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>Hunny App Review — Pairing Demo</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #fff9f4;
        color: #35251f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 18px;
        background:
          radial-gradient(circle at top left, rgba(255, 205, 173, 0.38), transparent 38rem),
          #fff9f4;
      }

      main {
        width: min(960px, 100%);
        padding: clamp(22px, 5vw, 48px);
        border: 1px solid rgba(106, 74, 61, 0.12);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 22px 70px rgba(80, 48, 33, 0.12);
      }

      .brand {
        width: 72px;
        height: 72px;
        display: block;
        margin-bottom: 22px;
        border-radius: 18px;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.75rem, 4vw, 2.75rem);
        line-height: 1.08;
      }

      p {
        margin: 12px 0 24px;
        color: #705b52;
        font-size: 1rem;
        line-height: 1.6;
      }

      video {
        display: block;
        width: 100%;
        max-height: 72vh;
        border-radius: 16px;
        background: #171311;
        box-shadow: 0 12px 36px rgba(53, 37, 31, 0.18);
      }

      .fallback {
        margin: 18px 0 0;
        font-size: 0.92rem;
      }

      a {
        color: #a24823;
        font-weight: 650;
      }
    </style>
  </head>
  <body>
    <main>
      <img class="brand" src="Assets/hunny-logo-color-header.png" alt="Hunny" />
      <h1>App Review Pairing Demo</h1>
      <p>
        Hunny version 1.0 (build 30) running on physical devices, including the pairing-code
        process and interaction between the caregiver app and the paired child device.
      </p>
      <video controls playsinline preload="metadata">
        <source src="Assets/review-8q3n7m-pairing-demo.mp4" type="video/mp4" />
        Your browser does not support embedded video playback.
      </video>
      <p class="fallback">
        If playback does not begin, <a href="Assets/review-8q3n7m-pairing-demo.mp4">open the video directly</a>.
      </p>
    </main>
  </body>
</html>
