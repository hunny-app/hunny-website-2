<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff9ed" />
    <meta name="apple-itunes-app" content="app-id=6784933624" />
    <meta
      http-equiv="refresh"
      content="1;url=https://apps.apple.com/app/id6784933624"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,500..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../get-app.css" />
    <title>Opening Hunny on the App Store</title>
  </head>
  <body>
    <main class="handoff-page">
      <section class="handoff-card" aria-labelledby="handoff-heading">
        <img
          class="handoff-logo"
          src="../Assets/hunny-logo-color-header.png"
          alt="Hunny"
          width="1254"
          height="1254"
        />
        <p class="download-eyebrow">ONE SWEET SECOND</p>
        <h1 id="handoff-heading">Opening the App Store…</h1>
        <p class="handoff-description">
          If it doesn’t open automatically, tap the button below.
        </p>
        <a
          class="download-button handoff-button"
          href="https://apps.apple.com/app/id6784933624"
          target="_top"
        >
          <span class="download-button__label">Open the App Store</span>
        </a>
        <p class="download-note">
          Still here? Tap Instagram’s <strong>•••</strong> menu, choose
          <strong>Open in external browser</strong>, then tap again.
        </p>
      </section>
    </main>

    <script>
      window.setTimeout(function () {
        window.location.replace("https://apps.apple.com/app/id6784933624");
      }, 250);
    </script>
  </body>
</html>
